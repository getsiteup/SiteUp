<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
  h1 { color: #fff; font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 16px; }
  .stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .stat { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px 16px; font-size: 13px; }

  .filter-btns { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #334155; background: #1e293b; color: #94a3b8; font-size: 12px; cursor: pointer; transition: all 0.15s; }

  .count-badge { background: rgba(255,255,255,0.2); color: white; border-radius: 10px; padding: 1px 7px; font-size: 11px; margin-left: 4px; }
  .export-btn { padding: 8px 18px; border-radius: 20px; border: none; background: #16a34a; color: #fff; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: background 0.15s; }
  .export-btn:hover { background: #15803d; }
  .search-bar { width: 100%; max-width: 400px; padding: 8px 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; font-size: 14px; margin-bottom: 14px; outline: none; }
  .search-bar:focus { border-color: #3b82f6; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { background: #1e293b; color: #94a3b8; padding: 10px 12px; text-align: left; border-bottom: 2px solid #334155; position: sticky; top: 0; z-index: 10; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  tbody tr { border-bottom: 1px solid #1a2535; transition: background 0.15s; }
  tbody tr:hover { background: #1e293b; }
  tbody tr.has-website { opacity: 0.7; }
  tbody td { padding: 9px 12px; vertical-align: middle; }
  .status-btn { width: 32px; height: 32px; border-radius: 6px; border: none; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; background: #334155; color: #94a3b8; }
  .status-btn:hover { transform: scale(1.15); }
  .status-btn.yellow { background: #fef08a; color: #000; }
  .status-btn.green { background: #86efac; color: #000; }
  .status-btn.red { background: #fca5a5; color: #000; }
  .name { font-weight: 600; color: #f1f5f9; }
  .phone { color: #60a5fa; font-family: monospace; font-size: 12px; }
  .city { color: #94a3b8; font-size: 12px; }
  .trade { color: #a78bfa; font-size: 11px; }
  .website-link { color: #34d399; font-size: 11px; text-decoration: none; max-width: 160px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .website-link:hover { text-decoration: underline; }
  .no-site-badge { background: #1e3a5f; color: #60a5fa; font-size: 10px; padding: 2px 7px; border-radius: 10px; }
  .notes-input { background: transparent; border: none; border-bottom: 1px solid #334155; color: #e2e8f0; font-size: 12px; width: 140px; padding: 2px 4px; outline: none; }
  .notes-input:focus { border-color: #3b82f6; }
  .divider-row td { background: #0d1829; color: #475569; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; padding: 6px 12px; }
  .export-toast { position: fixed; bottom: 24px; right: 24px; background: #16a34a; color: white; padding: 12px 20px; border-radius: 10px; font-size: 13px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
  .export-toast.show { opacity: 1; }
</style>
</head>

<h1>SiteUp — WA Leads</h1>
<p class="subtitle">437 unique local businesses • Click status to cycle: ⬜ → 🟡 Contacted → 🟢 Interested → 🔴 Not Interested</p>

<div class="stats">

</div>

<div class="top-bar">

    <button class="filter-btn" onclick="setFilter('green', this)">Interested <span class="count-badge" id="badge-green">0</span></button>
    <button class="filter-btn" onclick="setFilter('red', this)">Not Interested <span class="count-badge" id="badge-red">0</span></button>
  </div>
  <button class="export-btn" onclick="exportCSV()">⬇ Export for SimpleTexting</button>
</div>

<input type="text" class="search-bar" placeholder="Search by name, city, or trade..." oninput="searchLeads(this.value)" />

<table>

</table>

const statusCycle = { none: 'yellow', yellow: 'green', green: 'red', red: 'none' };
const statusEmoji = { none: '☐', yellow: '●', green: '●', red: '●' };
let currentFilter = 'all';
let currentSearch = '';

function cycleStatus(idx) {
  leads[idx].status = statusCycle[leads[idx].status];
  saveData();
  renderTable();
  updateCounts();
}

function updateNotes(idx, val) {
  leads[idx].notes = val;
  saveData();
}

function saveData() {
  try { localStorage.setItem('siteup_wa_leads', JSON.stringify(leads.map(l => ({status: l.status, notes: l.notes})))); } catch(e) {}
}

function loadData() {
  try {
    const saved = localStorage.getItem('siteup_wa_leads');
    if (saved) {
      const parsed = JSON.parse(saved);
      parsed.forEach((s, i) => { if (leads[i]) { leads[i].status = s.status; leads[i].notes = s.notes; } });
    }
  } catch(e) {}
}

function setFilter(type, btn) {
  currentFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
  updateCounts();
}

function searchLeads(val) {
  currentSearch = val.toLowerCase();
  renderTable();
}

function getFiltered() {
  return leads.map((l, i) => ({...l, idx: i})).filter(l => {
    if (currentFilter === 'no_website') return l.priority === 'no_website';
    if (currentFilter === 'has_website') return l.priority === 'has_website';
    if (currentFilter === 'yellow') return l.status === 'yellow';
    if (currentFilter === 'green') return l.status === 'green';
    if (currentFilter === 'red') return l.status === 'red';
    return true;
  }).filter(l => {
    if (!currentSearch) return true;
    return l.name.toLowerCase().includes(currentSearch) ||
           l.city.toLowerCase().includes(currentSearch) ||
           l.trade.toLowerCase().includes(currentSearch);
  });
}

function exportCSV() {
  const filtered = getFiltered();
  if (filtered.length === 0) {
    alert('No leads to export with current filter.');
    return;
  }

  // SimpleTexting format: First Name, Last Name, Phone Number
  const rows = [['First Name', 'Last Name', 'Phone Number', 'City', 'Trade', 'Notes']];
  filtered.forEach(l => {
    const nameParts = l.name.split(' ');
    const firstName = nameParts[0] || l.name;
    const lastName = nameParts.slice(1).join(' ') || '';
    // Clean phone number - SimpleTexting needs just digits
    const phone = l.phone.replace(/\D/g, '');
    rows.push([firstName, lastName, phone, l.city, l.trade, l.notes]);
  });

  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const filterLabel = currentFilter === 'all' ? 'all' : currentFilter.replace('_', '-');
  a.download = `SiteUp_Leads_${filterLabel}_${filtered.length}.csv`;
  a.click();
  URL.revokeObjectURL(url);

  const toast = document.getElementById('toast');
  toast.textContent = `✓ Exported ${filtered.length} leads — ready for SimpleTexting!`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function updateCounts() {
  const counts = { none: 0, yellow: 0, green: 0, red: 0, no_website: 0, has_website: 0 };
  leads.forEach(l => { counts[l.status]++; counts[l.priority]++; });
  document.getElementById('nosite-count').textContent = counts.no_website;
  document.getElementById('contacted-count').textContent = counts.yellow;
  document.getElementById('interested-count').textContent = counts.green;
  document.getElementById('lost-count').textContent = counts.red;
  document.getElementById('badge-yellow').textContent = counts.yellow;
  document.getElementById('badge-green').textContent = counts.green;
  document.getElementById('badge-red').textContent = counts.red;
  document.getElementById('total-count').textContent = getFiltered().length;
}

function renderTable() {
  const tbody = document.getElementById('leads-tbody');
  const filtered = getFiltered();
  let html = '';
  let inNoWeb = false, inHasWeb = false;

  filtered.forEach((l, displayNum) => {
    if (currentFilter === 'all') {
      if (l.priority === 'no_website' && !inNoWeb) {
        html += `<tr class="divider-row"><td colspan="8">🎯 Priority — No Website (${leads.filter(x=>x.priority==='no_website').length})</td></tr>`;
        inNoWeb = true;
      }
      if (l.priority === 'has_website' && !inHasWeb) {
        html += `<tr class="divider-row"><td colspan="8">Has Website — All Other Businesses (${leads.filter(x=>x.priority==='has_website').length})</td></tr>`;
        inHasWeb = true;
      }
    }

    const websiteCell = l.website
      ? `<a href="${l.website}" target="_blank" class="website-link" title="${l.website}">${l.website.replace('https://','').replace('http://','').split('/')[0]}</a>`
      : `<span class="no-site-badge">No website</span>`;

    html += `<tr class="${l.priority === 'has_website' ? 'has-website' : ''}">
      <td><button class="status-btn ${l.status}" onclick="cycleStatus(${l.idx})">${statusEmoji[l.status]}</button></td>
      <td style="color:#475569;font-size:12px">${displayNum + 1}</td>
      <td class="name">${l.name}</td>
      <td class="phone">${l.phone}</td>
      <td class="city">${l.city}</td>
      <td class="trade">${l.trade}</td>
      <td>${websiteCell}</td>
      <td><input class="notes-input" placeholder="Add note..." value="${l.notes.replace(/"/g,'&quot;').replace(/'/g,"&#39;")}" onchange="updateNotes(${l.idx}, this.value)" /></td>
    </tr>`;
  });

  tbody.innerHTML = html;
  document.getElementById('total-count').textContent = filtered.length;
}

loadData();
renderTable();
updateCounts();
</script>
